<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="配件仓 / 电脑仓 / 显示器仓出入库管理系统" />
    <meta name="theme-color" content="#f4f5f7" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>出入库管理系统</title>
    <script>
      // 绘制前恢复主题，避免深色用户刷新时闪白屏（与 useTheme.ts 的存储键保持一致）
      (function () {
        try {
          var t = window.localStorage.getItem('inventory_theme_mode');
          if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
